<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задание 6</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="container">
      <img id="logo" src="image.jpg" alt="Логотип сайта: цветок" width="80" height="80">
      <h1>Учебный сайт</h1>
    </div>
  </header>

  <main>
    <section>
      <h2>Калькулятор стоимости услуги</h2>
      <form id="calculator">
        <label>
          Количество экземпляров:<br>
          <input type="text" name="quantity" inputmode="numeric" value="1">
        </label>

        <fieldset>
          <legend>Тип услуги:</legend>
          <label>
            <input type="radio" name="serviceType" value="1" checked>
            Черно-белая печать — 10 руб./экз.
          </label>
          <label>
            <input type="radio" name="serviceType" value="2">
            Фотопечать — 50 руб./экз.
          </label>
          <label>
            <input type="radio" name="serviceType" value="3">
            Переплет — 100 руб./экз.
          </label>
        </fieldset>

        <div id="option-group">
          <label>
            Бумага для фотопечати:<br>
            <select name="serviceOption">
              <option value="glossy">Глянцевая — без доплаты</option>
              <option value="matte">Матовая — +20 руб./экз.</option>
            </select>
          </label>
        </div>

        <div id="property-group">
          <label>
            <input type="checkbox" name="property">
            Твердая обложка — +50 руб./экз.
          </label>
        </div>
      </form>
      <p id="result" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <div class="container">(с) 2026 Учебный сайт</div>
  </footer>
</body>
</html>
